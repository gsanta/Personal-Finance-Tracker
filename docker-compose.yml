services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=test-user
      - POSTGRES_PASSWORD=test-pw
      - POSTGRES_DB=cat_db
    ports:
      - 6501:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command: [ "-scheme", "http", "-external-url", "http://fake-gcs:4443" ]
    ports:
      - "4443:4443"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://fake-gcs:4443/storage/v1/b" ]
      interval: 5s
      timeout: 2s
      retries: 12
      
  app:
    image: openjdk:21-jdk
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "3012:3012"
    depends_on:
      - postgres
    volumes:
      - ./target/demo-0.0.1-SNAPSHOT.jar:/app/demo.jar
    working_dir: /app
    command: ["java", "-jar", "demo.jar"]
  frontend:
    image: node:20.11.1
    working_dir: /frontend
    volumes:
      - .:/frontend
    ports:
      - "3013:3013"
    command: /bin/sh -c "npm install && npm run dev"
volumes:
  postgres_data:
