services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=test-user
      - POSTGRES_PASSWORD=test-pw
      - POSTGRES_DB=cat_db
    ports:
      - 6501:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    environment:
      - STORAGE_EMULATOR_HOST=http://localhost:4443
    # Use filesystem backend for persistence; seed.json (optional) can still be loaded via -data
    command: [ "-scheme", "http", 
               "-external-url", "http://localhost:4443", 
               "-public-host", "localhost:4443", 
               "-backend", "filesystem", 
               "-filesystem-root", "/data", 
               "-data", "/data/seed.json" ]
    ports:
      - "4443:4443"
    volumes:
      - ./fake-gcs-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4443/storage/v1/b" ]
      interval: 5s
      timeout: 2s
      retries: 12
  pubsub-emulator:
    image: google/cloud-sdk:latest
    container_name: pubsub-emulator
    command: gcloud beta emulators xpubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"   # host:container
    environment:
      - PROJECT_ID=pubsub-dev-test
      - PUBSUB_EMULATOR_HOST=localhost:8085
    healthcheck:
      test: [ "CMD-SHELL", "curl -sS http://localhost:8085/" ]
      interval: 5s
      timeout: 2s
      retries: 5
      # Keep it lightweight: no restart policy by default, add if you want
      # restart: always

  media-asset-publisher:
    build:
      context: ./scripts/media_asset_created_publisher
      dockerfile: Dockerfile
    depends_on:
      - pubsub-emulator
    environment:
      - PROJECT_ID=pubsub-dev-test
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCS_BUCKET_NAME=dev-bucket
      - WATCH_ROOT=/data/personal-finance-uploads/uploads
    volumes:
      - ./fake-gcs-data:/data:ro
    # Long-running watcher; restart on failure
    restart: unless-stopped
      
